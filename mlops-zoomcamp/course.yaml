    - "Command line basics"
    - "Docker basics"
    - "Machine learning fundamentals: training, evaluating, and using models"
    - "At least 1 year of programming experience"
  recommended:
    - "Completion of Machine Learning Zoomcamp or equivalent ML experience"
    - "Ability to work with notebooks and Python scripts"
    - "AWS account for cloud examples"
    - "Familiarity with Git and GitHub"
  not_required:
    - "Prior MLOps experience"
    - "Prior DevOps experience"
    - "Prior cloud experience"
    - "Deep math"
    - "A degree"

audience:
  primary:
    - "data scientists"
    - "ML engineers"
    - "software engineers working with ML models"
  secondary:
    - "data engineers moving toward ML production workflows"
    - "MLOps beginners who already know ML basics"
    - "backend engineers who want to support ML services"
    - "ML practitioners building portfolio production projects"
  not_the_focus:
