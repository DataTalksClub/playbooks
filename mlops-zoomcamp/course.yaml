modules:
  - number: 1
    title: "Introduction"
    source_path: "01-intro/"
    instructor: "Alexey Grigorev"
    highlights:
      - "What MLOps is and why it matters"
      - "Environment preparation with GitHub Codespaces, local setup, or an AWS VM"
      - "Linux as the recommended development environment"
      - "Install Anaconda, Docker, and Docker Compose"
      - "Optional ride-duration prediction model on NYC taxi data"
      - "Course overview and structure"
      - "MLOps maturity model"
    subfiles:
      - "01-intro/duration-prediction.ipynb"
  - number: 2
    title: "Experiment Tracking and Model Management"
    source_path: "02-experiment-tracking/"
    primary_tool: "MLflow"
    highlights:
      - "Introduction to experiment tracking"
      - "Getting started with MLflow"
      - "Track parameters, metrics, and artifacts"
      - "Save and load models"
      - "Use the model registry"
      - "Apply MLflow in practice"
      - "Understand MLflow benefits, limitations, and alternatives"
      - "Optional remote MLflow tracking server on AWS with EC2, RDS PostgreSQL, and S3"
    current_guidance:
      - "MLflow list_experiments has been replaced by search_experiments in newer versions."
      - "MLflow model registry stages are deprecated starting with MLflow 2.9; use version tags and aliases instead."
    subfiles:
      - "02-experiment-tracking/duration-prediction.ipynb"
      - "02-experiment-tracking/model-registry.ipynb"
      - "02-experiment-tracking/mlflow_on_aws.md"
  - number: 3
    title: "Orchestration and ML Pipelines"
    source_path: "03-orchestration/"
    current_guidance: "The current module is orchestrator-agnostic; learners choose a tool such as Airflow, Prefect, Dagster, Kestra, Mage, or another orchestrator."
    highlights:
      - "Introduction to ML pipelines"
      - "Turn a notebook into a Python script"
      - "Use an orchestrator to turn the script into a production pipeline"
      - "Run a hello-world workflow in the chosen tool"
      - "Orchestrate training pipeline steps"
      - "Parameterize the workflow for monthly training and validation windows"
      - "Backfill historical runs"
      - "Optionally deploy the orchestrator to the cloud"
      - "Run MLflow with Docker for orchestrated workflows"
    historical_context:
      - "2022 and 2023 materials used Prefect."
      - "2024 materials used Mage."
    subfiles:
      - "03-orchestration/code/duration-prediction.py"
      - "03-orchestration/code/commands.md"
  - number: 4
    title: "Model Deployment"
    source_path: "04-deployment/"
    highlights:
      - "Compare online, streaming, and offline deployment strategies"
      - "Deploy models as Flask web services"
      - "Containerize a web service with Docker"
      - "Load models from the MLflow model registry"
      - "Optional streaming deployment with AWS Kinesis and Lambda"
      - "Prepare batch scoring scripts"
      - "Batch scoring with Mage"
    subfiles:
      - "04-deployment/web-service/"
      - "04-deployment/web-service-mlflow/"
      - "04-deployment/streaming/"
      - "04-deployment/batch/"
  - number: 5
    title: "Model Monitoring"
    source_path: "05-monitoring/"
    highlights:
      - "Introduction to ML monitoring"
      - "Monitoring environment setup"
      - "Prepare reference data and model"
      - "Calculate Evidently metrics"
      - "Build an Evidently monitoring dashboard"
      - "Run dummy monitoring"
      - "Monitor data quality"
      - "Save Grafana dashboards"
      - "Debug with Evidently test suites and reports"
      - "Run PostgreSQL, Adminer, and Grafana with Docker Compose"
      - "Simulate batch monitoring by calculating metrics and writing them to the database"
    current_guidance:
      - "Evidently changed substantially after version 0.7.0; the repo includes a post-evidently-0.7 working example."
      - "Some monitoring content references Prefect; the README says that section can be skipped."
    subfiles:
      - "05-monitoring/docker-compose.yml"
      - "05-monitoring/evidently_metrics_calculation.py"
      - "05-monitoring/debugging_nyc_taxi_data.ipynb"
      - "05-monitoring/post-evidently-0.7/"
  - number: 6
    title: "Best Practices"
    source_path: "06-best-practices/"
    highlights:
      - "Unit testing with pytest"
      - "Integration tests with Docker Compose"
      - "Testing cloud services with LocalStack"
      - "Code quality with linting and formatting"
      - "Git pre-commit hooks"
      - "Makefiles and make"
      - "Infrastructure as Code with Terraform"
      - "AWS stream-based pipeline infrastructure: Kinesis, Lambda, S3, and ECR"
      - "CI/CD with GitHub Actions"
      - "Continuous integration for environment setup, unit tests, integration tests, and Terraform plan"
      - "Continuous delivery for Terraform apply, Docker build and ECR push, and Lambda config updates"
    subfiles:
      - "06-best-practices/code/"
      - "06-best-practices/docs.md"

projects:
  final_project:
    source_path: "07-project/"
    goal: "Build an end-to-end machine learning project that applies the course material."
    dataset_rule: "NYC taxi data cannot be used for the final project because it is used throughout the modules and homework."
    attempts:
      latest_live_cohort_2025: 3
      general_note: "Number of attempts is cohort-specific; check the active course platform if a future live cohort is scheduled."
    required_deliverables:
      - "select a dataset of interest"
      - "train a model on the dataset"
      - "track experiments"
      - "use a model registry"
      - "create a model training pipeline"
      - "deploy the model in batch, web service, or streaming mode"
      - "monitor model performance"
      - "follow engineering best practices"
      - "clear reproducibility instructions"
    choices_allowed:
      - "AWS, GCP, Azure, localstack, Kubernetes, or another cloud/local deployment path"
      - "MLflow, Weights & Biases, or another experiment tracking tool"
      - "Prefect, Airflow, Flyte, Kubeflow, Argo, or another orchestrator"
      - "Evidently, WhyLabs/whylogs, or another monitoring stack"
      - "GitHub Actions, GitLab CI/CD, or another CI/CD tool"
      - "Terraform, Pulumi, CloudFormation, or another IaC tool"
    evaluation_criteria:
      - "problem description"
      - "cloud or container-management usage, with higher score for cloud plus IaC"
      - "experiment tracking and model registry"
      - "workflow orchestration"
      - "model deployment"
      - "model monitoring"
      - "reproducibility"
      - "best practices: unit tests, integration tests, linting or formatting, Makefile, pre-commit hooks, CI/CD"
    peer_review:
      required_reviews: 3
      note: "A live-cohort project is not complete until the learner evaluates three peers."
    portfolio_advice:
      - "Create a separate GitHub repository for the project."
      - "Use a meaningful title, such as Car Price Prediction or Music Genre Classification."
      - "Write a README detailed enough for reviewers and future employers."

outcomes:
  - "Set up a reproducible MLOps development environment"
  - "Train and package an ML model on the running taxi-duration example"
  - "Track experiments, artifacts, and models with MLflow"
  - "Use a model registry to manage model versions"
  - "Turn notebooks into reproducible pipeline code"
  - "Orchestrate training workflows with a chosen workflow tool"
  - "Deploy models as web services, batch jobs, or streaming services"
  - "Monitor model and data quality with Evidently and dashboards"
  - "Add testing, quality checks, pre-commit hooks, Make, CI/CD, and IaC"
  - "Build a portfolio-ready end-to-end MLOps project"

