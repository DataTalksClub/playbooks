modules:
  - number: 1
    title: "AI-Native Developer Workflow"
    source_path: "01-ai-native-workflow/"
    highlights:
      - "Refine a vague product idea into a specification and choose a technology stack you can review"
      - "Break the specification into focused backlog tasks with goals, acceptance criteria, constraints, and boundaries"
      - "Give coding agents durable context through AGENTS.md and supporting project documents"
      - "Separate task grooming, implementation, and independent verification with product manager, software engineer, and QA roles"
      - "Use loop engineering to continue work until a checkable condition is met"
      - "Use graph engineering to orchestrate specialized agents and return failed tasks to implementation"
    outcome: "Design and run an AI-native workflow from initial idea through implementation and independent QA while keeping human decisions and review central."
  - number: 2
    title: "End-to-End Project (Snake)"
    source_path: "02-end-to-end/"
    project_example: "Snake Arena Online"
    highlights:
      - "Build frontend with Lovable, React, and tests"
      - "Use GitHub Codespaces with Antigravity, Cursor, Copilot, Codex, or local tools"
      - "Extract OpenAPI specs from frontend needs"
      - "Generate a FastAPI backend from OpenAPI specs"
      - "Use AGENTS.md to guide AI agents"
      - "Integrate frontend and backend"
      - "Add database support with SQLAlchemy, SQLite, and Postgres"
      - "Add unit and integration tests"
      - "Containerize with Docker Compose"
      - "Deploy a single-container app to Render"
      - "Create CI/CD with GitHub Actions for tests and deployment"
  - number: 3
    title: "Model-Context Protocol"
    source_path: "03-mcp/"
    highlights:
      - "Understand MCP clients, servers, tools, resources, and prompts"
      - "Compare stdio and HTTPS communication modes"
      - "Run a Python MCP server and call tools with JSON-RPC"
      - "Use MCP Inspector"
      - "Configure MCP clients including VS Code, Codex, Cursor, and Antigravity"
      - "Use Context7 for live documentation and debugging"
      - "Try developer workflows such as repo triage, PR summarization, scripted edits, data queries, and publishing posts"
      - "Discuss local vs. remote servers, security, and permissions"
  - number: 4
    title: "Build an AI Coding Agent (Django)"
    source_path: "04-build-coding-agent/"
    highlights:
      - "Build a coding agent that scaffolds and extends projects"
      - "Use a Django template as the base project"
      - "Review OpenAI Responses API and function calling"
      - "Define tools for file reading/writing, command execution, search, and file tree inspection"
      - "Create a developer prompt for the Django project"
      - "Run an agent with ToyAIKit"
      - "Explore OpenAI Agents SDK, PydanticAI, and Z.ai"
      - "Outcome: a Django app created and modified by an AI agent"
    module_prerequisites:
      - "Python 3.8+"
      - "Jupyter Notebook"
      - "OpenAI API key"
      - "Anthropic API key optional"
      - "GitHub account optional for Codespaces"
  - number: 5
    title: "AI for Testing, CI/CD and DevOps"
    source_path: "05-cicd-devops/"
    highlights:
      - "AI-assisted PR reviews and summaries"
      - "Change-risk hints"
      - "Automated test generation"
      - "Coverage gates"
      - "LLM evals and regression checks in CI"
      - "Release notes and changelog drafting"
      - "Deployment runbooks"
      - "Incident postmortems and on-call copilots"
      - "Secure AI usage: secrets, data redaction, OSS policy, artifact retention, and audit"
    deliverable: "A repository with CI that auto-summarizes PRs, generates draft tests, and composes release notes on tag."
  - number: 6
    title: "Automation with Low-Code and No-Code AI (n8n)"
    source_path: "06-automation-lowcode/"
    highlights:
      - "Install n8n"
      - "Build low-code/no-code AI workflows"
      - "Create posts for LinkedIn"
      - "Tailor a CV for a specific position"

outcomes:
  main_outcome: "Use AI coding tools in real development workflows without giving up engineering discipline."
  portfolio_outcome: "A complete deployed application that demonstrates AI-assisted development, API design, testing, containerization, deployment, and CI/CD."
  certificate_rule_summary: "Certificate available during a live cohort after passing the final project and completing 3 peer reviews."

projects:
  slots:
    - "attempt 1"
    - "attempt 2"
  certificate_requirement:
    required_projects_count: 1
    peer_reviews_required: 3
    note: "Skipping required peer reviews fails the project."
  project_goal: "Build a complete application of your own, end to end, using AI tools."
  project_expectations:
    - "Choose a problem that interests you"
    - "Describe the problem and expected system functionality"
    - "Create a frontend"
    - "Create a backend"
    - "Describe frontend/backend communication with OpenAPI specs"
    - "Use any order: frontend first, specs first, or backend first"
    - "Use any tech stack; Python or Django are not required"
    - "A typical project has a frontend, backend, database, and a public deployment"
    - "Document how AI tools, prompts, workflows, AGENTS.md, or MCP were used"
    - "Test the application thoroughly"
    - "Containerize the application"
    - "Deploy the application so others can try it"
  optional_project_elements:
    - "machine learning component"
    - "MCP server or MCP-based workflow"
    - "CI/CD deployment automation"
  deliverables:
    - "README.md with problem description, system functionality, setup, run, test, and deployment instructions"
    - "Frontend implementation with centralized backend communication"
    - "OpenAPI specification that reflects frontend requirements"
    - "Backend implementation that follows the OpenAPI contract"
    - "Database or persistent storage"
    - "Unit and/or integration tests"
    - "Dockerfile or docker-compose setup"
    - "Deployment URL or clear proof of deployment"
    - "CI/CD pipeline where possible"
  rubric:
    total_max_points: 26
    criteria:
      - "problem description"
      - "AI system development: tools, workflow, MCP"
      - "technologies and system architecture"
      - "front-end implementation"
      - "API contract / OpenAPI specifications"
      - "back-end implementation"
      - "database integration"
      - "containerization"
      - "integration testing"
      - "deployment"
      - "CI/CD pipeline"
      - "reproducibility"

