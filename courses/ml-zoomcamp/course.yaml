cohort_cadence:
  usual_start_month: "September"
  usual_end_month: "December"
  usual_duration: "4 months"
  frequency: "once per year"
  next_live_cohort:
    year: 2026
    start: "September 2026"
    registration_status: "open"
  live_cohort_note: "Lectures are pre-recorded; live cohort means shared deadlines, graded homework, leaderboard, peer review, and certificate eligibility."

delivery:
  lectures: "pre-recorded"
  live_sessions: "kickoff and occasional updates"
  homework:
    live_cohort: "graded"
    self_paced: "available but not scored"
  submissions_platform: "courses.datatalks.club"
  certificate_available:
    live_cohort: true
    self_paced: false

level:
  label: "Beginner to Intermediate"
  notes: "Starts from ML basics but assumes general programming literacy."

prerequisites:
  required:
    - "Strong programming experience in any major language"
    - "Comfort with command line basics"
    - "Git basics"
    - "Docker basics"
  recommended:
    - "Basic Python"
    - "Basic math intuition"
  not_required:
    - "Prior machine learning experience"
    - "Advanced math"
    - "Prior cloud experience"
    - "A degree"

audience:
  primary:
    - "software engineers"
    - "data analysts"
    - "data practitioners with programming experience"
    - "learners who want to become machine learning engineers"
  secondary:
    - "data engineers transitioning to ML"
    - "infrastructure or SRE practitioners interested in ML deployment"
    - "career switchers with enough programming foundation"

time_commitment:
  weekly_estimate: "10-15 hours"
  typical_week:
    - "3-5 hours watching module videos"
    - "3-5 hours coding along and experimenting"
    - "2-5 hours completing homework"
  project_blocks: "2-3 weeks of focused work for each project block"

topics:
  - "machine learning engineering"
  - "CRISP-DM"
  - "exploratory data analysis"
  - "feature engineering"
  - "regression"
  - "classification"
  - "model evaluation"
  - "decision trees"
  - "random forests"
  - "gradient boosting"
  - "neural networks"
  - "deep learning"
  - "serverless inference"
  - "model deployment"
  - "Kubernetes model serving"

tools:
  - "Jupyter Notebooks"
  - "Python"
  - "NumPy"
  - "Pandas"
  - "Scikit-Learn"
  - "TensorFlow / Keras"
  - "PyTorch"
  - "XGBoost"
  - "FastAPI"
  - "Pydantic"
