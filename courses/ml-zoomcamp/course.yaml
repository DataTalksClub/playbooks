  - "AWS Elastic Beanstalk"
  - "AWS EKS"
  - "ONNX Runtime"
  - "Kubernetes"
  - "TensorFlow Serving"
  - "KServe"
  - "Fly.io"
  - "GitHub Codespaces"

modules:
  - number: 1
    title: "Introduction to Machine Learning"
    source_path: "01-intro/"
    highlights:
      - "ML vs rule-based systems"
      - "supervised learning basics"
      - "CRISP-DM"
      - "model selection process"
      - "environment setup"
      - "NumPy, linear algebra, and pandas refresher"
  - number: 2
    title: "Machine Learning for Regression"
    source_path: "02-regression/"
    project_dataset: "car price prediction"
    highlights:
      - "linear regression"
      - "car price prediction"
      - "feature engineering"
      - "categorical variables"
      - "regularization"
      - "model validation"
      - "RMSE"
  - number: 3
    title: "Machine Learning for Classification"
    source_path: "03-classification/"
    project_dataset: "customer churn / Telco churn"
    highlights:
      - "logistic regression"
      - "customer churn prediction"
      - "categorical variable encoding"
      - "feature importance"
      - "mutual information"
      - "correlation"
      - "one-hot encoding"
      - "model interpretation"
  - number: 4
    title: "Evaluation Metrics for Classification"
    source_path: "04-evaluation/"
    highlights:
      - "accuracy, precision, recall, and F1"
      - "dummy model baseline"
      - "ROC curves and AUC"
      - "cross-validation"
      - "confusion matrices"
      - "class imbalance"
  - number: 5
    title: "Deploying Machine Learning Models"
    source_path: "05-deployment/"
    current_guidance: "Original module is partly outdated; watch the theory and use the FastAPI + uv workshop for current practice."
    highlights:
      - "model serialization"
      - "notebook-to-script workflow"
      - "FastAPI web services via the workshop"
      - "Pydantic validation"
      - "uv environment management"
      - "Docker containerization"
      - "cloud deployment with Fly.io; older module uses AWS Elastic Beanstalk"
  - number: 6
    title: "Decision Trees and Ensemble Learning"
    source_path: "06-trees/"
    project_dataset: "credit risk scoring"
    highlights:
      - "decision trees"
      - "decision tree learning algorithm"
      - "random forests"
      - "XGBoost"
      - "hyperparameter tuning"
      - "feature importance"
      - "selecting the best model"
  - number: 7
    title: "Midterm Project"
    source_path: "projects/"
    highlights:
      - "independent end-to-end ML project"
      - "apply modules 1-6"
      - "train and deploy a model as a web service"
  - number: 8
    title: "Neural Networks and Deep Learning"
    source_path: "08-deep-learning/"
    project_dataset: "clothing / fashion classification"
    current_guidance: "Main theory is in the TensorFlow/Keras module; PyTorch materials were re-recorded and should be used for PyTorch practice."
    highlights:
      - "neural network fundamentals"
      - "PyTorch"
      - "TensorFlow and Keras"
      - "convolutional neural networks"
      - "transfer learning"
      - "learning-rate tuning"
      - "checkpointing"
      - "regularization and dropout"
      - "data augmentation"
  - number: 9
    title: "Serverless Deep Learning"
    source_path: "09-serverless/"
    current_guidance: "Use the workshop for most content; original units 9.3-9.6 are marked outdated, while 9.1, 9.2, and 9.7 remain useful."
    highlights:
      - "serverless concepts"
      - "AWS Lambda"
      - "ONNX Runtime"
      - "API Gateway"
  - number: 10
    title: "Kubernetes and TensorFlow Serving"
    source_path: "10-kubernetes/"
    current_guidance: "Original module is partly outdated; use the workshop. Lessons 10.5 and 10.8 may still be useful."
    highlights:
      - "Kubernetes basics"
      - "TensorFlow Serving"
      - "pre-processing service"
      - "Docker Compose"
      - "model deployment and scaling"
      - "load balancing"
      - "EKS"
  - number: 11
    title: "KServe"
    source_path: "11-kserve/"
    status: "optional / potentially outdated"
    highlights:
      - "running KServe locally"
      - "deploying Scikit-Learn models with KServe"
      - "custom Scikit-Learn images"
      - "serving TensorFlow models with KServe"
      - "KServe transformers"
      - "deploying KServe on EKS"

outcomes:
  main_outcome: "Build and deploy production-style machine learning systems."
  portfolio_outcome: "Two or more portfolio-ready ML projects with deployed models."
  certificate_rule_summary: "Certificate available during a live cohort after completing two required projects, meeting project deadlines and passing scores, and completing peer reviews."

projects:
  slots:
    - "midterm"
    - "capstone"
    - "second capstone"
  certificate_requirement:
    required_projects_count: 2
    accepted_combinations:
      - "midterm + capstone"
      - "capstone + second capstone"
    peer_reviews_per_project: 3
    deployed_model_required: true
    note: "Skipping required peer reviews fails the project."
  project_expectations:
    - "Choose a new public dataset not used in lectures or homework"
    - "Describe the problem and explain how the model will be used"
    - "Prepare data, clean it, and do EDA with feature importance analysis"
    - "Train, validate, and select a model"
    - "Train multiple models and tune parameters for stronger rubric score"
    - "Export notebook logic into scripts"
    - "Deploy the final model; a notebook-only project is not sufficient"
    - "Document setup, reproducibility, and deployment clearly"
  forbidden_datasets:
    - "Car price prediction"
    - "Customer churn / Telco churn"
    - "Credit risk scoring"
    - "Clothing classification"
    - "Datasets used in deep learning, serverless, and Kubernetes modules"
  deliverables:
    - "README.md with problem description, run instructions, and data instructions"
    - "notebook.ipynb or equivalent with data preparation, EDA, feature analysis, model selection, and tuning"
    - "train.py or equivalent training script"
    - "predict.py or equivalent prediction service"
    - "dependency file such as Pipenv, requirements.txt, pyproject.toml, conda environment, or bentofile.yaml"
    - "Dockerfile or equivalent container build configuration"
    - "Deployment URL, or video/screenshot showing deployed service interaction"
  deployment_options:
    - "FastAPI in Docker"
    - "AWS Lambda with ONNX Runtime"
    - "Streamlit or Gradio demo"
    - "Kubernetes"
    - "Flask or BentoML"
    - "KServe"
  rubric:
    total_max_points: 16
    criteria:
      - "problem description"
      - "EDA"
      - "model training"
      - "notebook exported to script"
      - "reproducibility"
      - "model deployment"
      - "dependency and environment management"
      - "containerization"
      - "cloud or Kubernetes deployment"
    plagiarism_policy: "Plagiarism, reusing another person's project, or reusing your own ML Zoomcamp project from another iteration can result in 0 points."

live_cohort_benefits:
  - "weekly deadlines"
  - "graded homework"
  - "leaderboard"
