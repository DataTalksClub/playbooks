id: ml26-telegram-002
enabled: true
description: 'ML2026-002 Module 4: classification evaluation'
tags:
- ml-zoomcamp-2026
- course-telegram
folder: ML Zoomcamp 2026
auto_pause_after: 1
actions:
- id: course
  type: cmp_read_course
  connection_id: cmp-production
  course_slug: ml-zoomcamp-2026
  timeout_seconds: 15
- id: facts
  type: filter
  when:
    steps.course.output.course.slug:
      equals: ml-zoomcamp-2026
    steps.course.output.course.start_date:
      equals: '2026-09-14'
    steps.course.output.course.end_date:
      equals: '2027-01-25'
    steps.course.output.course.finished:
      equals: false
    steps.course.output.course.visible:
      equals: true
    steps.course.output.checked_at:
      lt: '2026-10-19T23:00:00+00:00'
      exists: true
    steps.course.output.homeworks.hw04.due_date:
      equals: '2026-10-19T23:00:00+00:00'
    steps.course.output.homeworks.hw04.state:
      equals: OP
- id: send
  type: telegram_send
  connection_id: dtc-course-announcements
  chat_id: '-1001435532197'
  text: "We start Module 4 on Evaluation Metrics for Classification.\r\n\r\nOnce you have a classification model, you need to know how well it performs. Accuracy alone can be misleading, especially when classes are imbalanced. With the right metrics, you can compare models and report performance you can trust.\r\n\r\nWe cover:\r\n\r\n- Accuracy, precision, recall, and F1 score\r\n- Confusion matrices\r\n- ROC curves and AUC\r\n- Cross-validation\r\n- Comparing against a dummy baseline\r\n\r\nMaterials:\r\nhttps://github.com/DataTalksClub/machine-learning-zoomcamp/tree/main/04-evaluation\r\n\r\nHomework 4 evaluates models on the 2026 lead-scoring dataset.\r\n\r\nHomework:\r\nhttps://github.com/DataTalksClub/machine-learning-zoomcamp/blob/main/cohorts/2026/homework/04-evaluation/homework.md\r\n\r\nSubmit:\r\nhttps://courses.datatalks.club/ml-zoomcamp-2026/homework/hw04\r\n\r\nDeadline: October 20, 2026 at 01:00 CEST (October 19 at 23:00 UTC).\r\n\r\nNext week, Module 5 covers deploying machine learning models.\r\n\r\nQuestions go in the course Slack channel:\r\nhttps://app.slack.com/client/T01ATQK62F8/C0288NJ5XSA"
  timeout_seconds: 15
trigger:
  connector: schedule
  event: schedule.triggered
  filters:
    schedule:
      equals: ml26-002
