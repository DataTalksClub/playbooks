id: ml26-telegram-013
enabled: true
description: 'ML2026-013 Module 9: serverless deep learning'
tags:
- ml-zoomcamp-2026
- course-telegram
folder: ML Zoomcamp 2026
auto_pause_after: 1
actions:
- id: course
  type: cmp_read_course
  connection_id: cmp-production
  course_slug: ml-zoomcamp-2026
  timeout_seconds: 15
- id: facts
  type: filter
  when:
    steps.course.output.course.slug:
      equals: ml-zoomcamp-2026
    steps.course.output.course.start_date:
      equals: '2026-09-14'
    steps.course.output.course.end_date:
      equals: '2027-01-25'
    steps.course.output.course.finished:
      equals: false
    steps.course.output.course.visible:
      equals: true
    steps.course.output.checked_at:
      lt: '2026-12-07T23:00:00+00:00'
      exists: true
    steps.course.output.homeworks.hw09.due_date:
      equals: '2026-12-07T23:00:00+00:00'
    steps.course.output.homeworks.hw09.state:
      equals: OP
- id: send
  type: telegram_send
  connection_id: dtc-course-announcements
  chat_id: '-1001435532197'
  text: "We start Module 9 on Serverless Deep Learning.\r\n\r\nOnce you have a deep learning model, you need a way to serve it without running a server all the time. In this module, we deploy models with AWS Lambda.\r\n\r\nWe cover:\r\n\r\n- How serverless deployment works\r\n- Deploying models with AWS Lambda\r\n- Running models with ONNX Runtime\r\n- Exposing Lambda functions through API Gateway\r\n\r\nUse the workshop for most of this module. In the original module, units 9.1, 9.2, and 9.7 are still useful. Units 9.3 to 9.6 are outdated.\r\n\r\nMaterials:\r\nhttps://github.com/DataTalksClub/machine-learning-zoomcamp/tree/main/09-serverless\r\n\r\nWorkshop:\r\nhttps://github.com/DataTalksClub/machine-learning-zoomcamp/tree/main/09-serverless/workshop\r\n\r\nHomework 9 asks you to package the hair classifier from Homework 8 for AWS Lambda.\r\n\r\nHomework:\r\nhttps://github.com/DataTalksClub/machine-learning-zoomcamp/blob/main/cohorts/2026/homework/09-serverless/homework.md\r\n\r\nSubmit:\r\nhttps://courses.datatalks.club/ml-zoomcamp-2026/homework/hw09\r\n\r\nDeadline: December 8, 2026 at 00:00 CET (December 7 at 23:00 UTC).\r\n\r\nNext week, Module 10 covers Kubernetes and TensorFlow Serving.\r\n\r\nQuestions go in the course Slack channel:\r\nhttps://app.slack.com/client/T01ATQK62F8/C0288NJ5XSA"
  timeout_seconds: 15
trigger:
  connector: schedule
  event: schedule.triggered
  filters:
    schedule:
      equals: ml26-013
