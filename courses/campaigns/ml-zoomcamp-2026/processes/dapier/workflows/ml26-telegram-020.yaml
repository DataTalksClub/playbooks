id: ml26-telegram-020
enabled: true
description: ML2026-020 Second capstone window
tags:
- ml-zoomcamp-2026
- course-telegram
folder: ML Zoomcamp 2026
auto_pause_after: 1
actions:
- id: course
  type: cmp_read_course
  connection_id: cmp-production
  course_slug: ml-zoomcamp-2026
  timeout_seconds: 15
- id: facts
  type: filter
  when:
    steps.course.output.course.slug:
      equals: ml-zoomcamp-2026
    steps.course.output.course.start_date:
      equals: '2026-09-14'
    steps.course.output.course.end_date:
      equals: '2027-01-25'
    steps.course.output.course.finished:
      equals: false
    steps.course.output.course.visible:
      equals: true
    steps.course.output.checked_at:
      lt: '2027-01-18T23:00:00+00:00'
      exists: true
    steps.course.output.projects.capstone2.submission_due_date:
      equals: '2027-01-18T23:00:00+00:00'
    steps.course.output.projects.capstone2.peer_review_due_date:
      equals: '2027-01-25T23:00:00+00:00'
- id: send
  type: telegram_send
  connection_id: dtc-course-announcements
  chat_id: '-1001435532197'
  text: "ML Zoomcamp 2026: the second capstone window is approaching.\r\n\r\nUse this window to complete an end-to-end machine learning project. Choose a dataset, train and evaluate models, and deploy the model you selected.\r\n\r\nProject guidelines:\r\nhttps://github.com/DataTalksClub/machine-learning-zoomcamp/tree/main/projects\r\n\r\nProject page:\r\nhttps://courses.datatalks.club/ml-zoomcamp-2026/project/capstone2\r\n\r\nSubmission deadline: January 19, 2027 at 00:00 CET (January 18 at 23:00 UTC).\r\n\r\nPeer review deadline: January 26, 2027 at 00:00 CET (January 25 at 23:00 UTC).\r\n\r\nAfter submitting, complete the three assigned peer reviews on time. Skipping the peer reviews fails the project.\r\n\r\nCertificate requirements:\r\nhttps://datatalks.club/docs/courses/zoomcamp-logistics/certification/\r\n\r\nQuestions go in the course Slack channel:\r\nhttps://app.slack.com/client/T01ATQK62F8/C0288NJ5XSA"
  timeout_seconds: 15
trigger:
  connector: schedule
  event: schedule.triggered
  filters:
    schedule:
      equals: ml26-020
