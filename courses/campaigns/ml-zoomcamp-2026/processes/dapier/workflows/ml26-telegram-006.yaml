id: ml26-telegram-006
enabled: true
description: 'ML2026-006 Module 6: trees and ensembles'
tags:
- ml-zoomcamp-2026
- course-telegram
folder: ML Zoomcamp 2026
auto_pause_after: 1
actions:
- id: course
  type: cmp_read_course
  connection_id: cmp-production
  course_slug: ml-zoomcamp-2026
  timeout_seconds: 15
- id: facts
  type: filter
  when:
    steps.course.output.course.slug:
      equals: ml-zoomcamp-2026
    steps.course.output.course.start_date:
      equals: '2026-09-14'
    steps.course.output.course.end_date:
      equals: '2027-01-25'
    steps.course.output.course.finished:
      equals: false
    steps.course.output.course.visible:
      equals: true
    steps.course.output.checked_at:
      lt: '2026-11-02T23:00:00+00:00'
      exists: true
    steps.course.output.homeworks.hw06.due_date:
      equals: '2026-11-02T23:00:00+00:00'
    steps.course.output.homeworks.hw06.state:
      equals: OP
- id: send
  type: telegram_send
  connection_id: dtc-course-announcements
  chat_id: '-1001435532197'
  text: "We start Module 6 on Decision Trees and Ensemble Learning.\r\n\r\nLinear models are a good start, but tree-based models often work better on tabular data. In this module, we build a credit risk scoring model and combine many trees into stronger models.\r\n\r\nWe cover:\r\n\r\n- How we train decision trees\r\n- Random forests\r\n- Gradient boosting with XGBoost\r\n- Hyperparameter tuning\r\n- Feature importance\r\n- Selecting the best model\r\n\r\nMaterials:\r\nhttps://github.com/DataTalksClub/machine-learning-zoomcamp/tree/main/06-trees\r\n\r\nHomework 6 applies tree-based models to the 2026 Car Fuel Efficiency dataset.\r\n\r\nHomework:\r\nhttps://github.com/DataTalksClub/machine-learning-zoomcamp/blob/main/cohorts/2026/homework/06-trees/homework.md\r\n\r\nSubmit:\r\nhttps://courses.datatalks.club/ml-zoomcamp-2026/homework/hw06\r\n\r\nDeadline: November 3, 2026 at 00:00 CET (November 2 at 23:00 UTC).\r\n\r\nAfter this module, we start the midterm project.\r\n\r\nQuestions go in the course Slack channel:\r\nhttps://app.slack.com/client/T01ATQK62F8/C0288NJ5XSA"
  timeout_seconds: 15
trigger:
  connector: schedule
  event: schedule.triggered
  filters:
    schedule:
      equals: ml26-006
