id: ml26-telegram-001
enabled: true
description: ML2026-001 Module 3 catch-up + Homework 3 reminder
tags:
- ml-zoomcamp-2026
- course-telegram
folder: ML Zoomcamp 2026
auto_pause_after: 1
actions:
- id: course
  type: cmp_read_course
  connection_id: cmp-production
  course_slug: ml-zoomcamp-2026
  timeout_seconds: 15
- id: facts
  type: filter
  when:
    steps.course.output.course.slug:
      equals: ml-zoomcamp-2026
    steps.course.output.course.start_date:
      equals: '2026-09-14'
    steps.course.output.course.end_date:
      equals: '2027-01-25'
    steps.course.output.course.finished:
      equals: false
    steps.course.output.course.visible:
      equals: true
    steps.course.output.checked_at:
      lt: '2026-10-12T23:00:00+00:00'
      exists: true
    steps.course.output.homeworks.hw03.due_date:
      equals: '2026-10-12T23:00:00+00:00'
    steps.course.output.homeworks.hw03.state:
      equals: OP
- id: send
  type: telegram_send
  connection_id: dtc-course-announcements
  chat_id: '-1001435532197'
  text: 'ML Zoomcamp 2026 is on Module 3: Machine Learning for Classification.


    In this module, we build a customer churn model with logistic regression and study one-hot encoding, feature importance, and model interpretation.


    Materials:

    https://github.com/DataTalksClub/machine-learning-zoomcamp/tree/main/03-classification


    Homework 3 uses the 2026 lead-scoring dataset to predict whether a client signs up for the platform. Submit your answers before the deadline:

    October 13, 2026 at 01:00 CEST (October 12 at 23:00 UTC).


    Homework:

    https://github.com/DataTalksClub/machine-learning-zoomcamp/blob/main/cohorts/2026/homework/03-classification/homework.md


    Submit:

    https://courses.datatalks.club/ml-zoomcamp-2026/homework/hw03


    Module 4 covers evaluation metrics for classification.


    Questions go in the course Slack channel:

    https://app.slack.com/client/T01ATQK62F8/C0288NJ5XSA'
  timeout_seconds: 15
trigger:
  connector: schedule
  event: schedule.triggered
  filters:
    schedule:
      equals: ml26-001
