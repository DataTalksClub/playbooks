modules:
  - number: 1
    title: "Containerization and Infrastructure as Code"
    source_path: "01-docker-terraform/"
    highlights:
      - "GCP overview and account/project setup"
      - "Docker fundamentals"
      - "Python virtual environments with uv"
      - "Dockerizing an ingestion script"
      - "PostgreSQL and pgAdmin with Docker"
      - "Docker Compose for multi-container workflows"
      - "NYC taxi ingestion with pandas and SQLAlchemy"
      - "SQL refresher"
      - "Terraform concepts and GCP infrastructure provisioning"
    subfiles:
      - "01-docker-terraform/docker-sql/README.md"
      - "01-docker-terraform/terraform/README.md"
  - number: 2
    title: "Workflow Orchestration"
    source_path: "02-workflow-orchestration/"
    primary_tool: "Kestra"
    highlights:
      - "Workflow orchestration concepts: flows, tasks, inputs, outputs, triggers, variables, concurrency"
      - "Run Kestra locally with Docker Compose"
      - "Execute Python scripts from Kestra flows"
      - "Build ETL pipelines for yellow and green taxi data into local Postgres"
      - "Schedule and backfill workflows"
      - "Build ELT pipelines with GCS as a data lake and BigQuery as a warehouse"
      - "Use Kestra AI Copilot and context engineering for flow creation"
      - "Optional RAG example using Kestra workflows"
      - "Optional deployment of Kestra to Google Cloud and Git-backed flow sync"
  - number: 2.5
    title: "Workshop: Data Ingestion with dlt"
    source_path: "cohorts/2026/workshops/dlt/"
    highlights:
      - "Build an API-to-warehouse pipeline from the Open Library API"
      - "Use dlt to extract, normalize, and load data"
      - "Store normalized tables in DuckDB"
      - "Use dlt MCP with an agentic IDE"
      - "Inspect pipeline state, schemas, and tables with the dlt dashboard"
      - "Optional visualizations with marimo and ibis"
  - number: 3
    title: "Data Warehouse and BigQuery"
    source_path: "03-data-warehouse/"
    primary_tool: "BigQuery"
    highlights:
      - "Data warehouse concepts"
      - "BigQuery SQL basics"
      - "Partitioning and clustering"
      - "BigQuery best practices and internals"
      - "Cost and query optimization"
      - "BigQuery ML"
      - "Exporting and deploying a BigQuery ML model with Docker"
  - number: 4
    title: "Analytics Engineering"
    source_path: "04-analytics-engineering/"
    primary_tool: "dbt"
    highlights:
      - "Transform warehouse data into analytical views"
      - "Analytics engineering and data modeling"
      - "dbt project structure"
      - "Sources, models, seeds, macros, packages, tests, and documentation"
      - "Cloud setup with BigQuery and dbt Platform"
      - "Local setup with DuckDB and dbt Core"
      - "SQL refresher on CTEs and window functions"
    module_prerequisites:
      - "Cloud setup expects Module 3 with BigQuery enabled and taxi data loaded"
      - "Local DuckDB setup has no prior module dependency"
  - number: 5
    title: "Data Platforms"
    source_path: "05-data-platforms/"
    primary_tool: "Bruin"
    highlights:
      - "Modern data platform concepts"
      - "Data ingestion, transformation, orchestration, quality, metadata, and lineage in one project"
      - "Create a project with bruin init"
      - "Build an end-to-end NYC taxi pipeline with ingestion, staging, and reports layers"
      - "Run SQL, Python, and YAML assets"
      - "Use Bruin MCP with AI agents"
      - "Deploy and monitor pipelines with Bruin Cloud"
  - number: 6
    title: "Batch Processing"
    source_path: "06-batch/"
    primary_tool: "Apache Spark"
    highlights:
      - "Batch processing concepts"
      - "Spark and PySpark fundamentals"
      - "Local Spark setup for Windows, Linux, and macOS"
      - "Spark DataFrames and Spark SQL"
      - "Preparing yellow and green taxi data"
      - "Spark cluster anatomy"
      - "GroupBy and joins internals"
      - "Optional RDD operations"
      - "Connect Spark to Google Cloud Storage and BigQuery"
      - "Run Spark on Google Dataproc"
  - number: 7
    title: "Stream Processing"
    source_path: "07-streaming/"
    current_guidance: "Current 2026 materials center the hands-on stream-processing work on a PyFlink workshop with Redpanda, while Kafka theory and older examples are optional."
    highlights:
      - "Build a real-time streaming pipeline: Python producer -> Kafka-compatible Redpanda -> Flink -> PostgreSQL"
      - "Use Redpanda as a lightweight Kafka-compatible broker"
      - "Produce and consume taxi ride messages with Python"
      - "Add a database sink"
      - "Use PyFlink for stream processing"
      - "Study optional Kafka theory with Java examples"
      - "Review supplementary Python and PyFlink examples from previous years"

projects:
  final_project:
    source_path: "projects/README.md"
    goal: "Build an end-to-end data pipeline and dashboard using a dataset other than NYC taxi data."
    duration: "2-3 weeks"
    attempts: 2
    dataset_rule: "NYC taxi data cannot be used for the final project because it is used throughout the modules and homework."
    required_deliverables:
      - "problem description"
      - "pipeline that ingests data from a chosen source"
      - "data lake storage"
      - "data warehouse layer"
      - "transformations for analysis"
      - "dashboard with at least two visualizations"
      - "clear reproducibility instructions"
    choices_allowed:
      - "batch or streaming pipeline"
      - "GCP, AWS, Azure, or another cloud/local approach if justified"
      - "course tools or equivalent alternatives"
      - "Looker Studio, Streamlit, Metabase, Superset, or another BI/dashboarding tool"
    evaluation_criteria:
      - "problem description"
      - "cloud and infrastructure as code"
      - "data ingestion: batch/workflow orchestration or streaming"
      - "data warehouse optimization"
      - "transformations with dbt, Spark, or similar tools"
      - "dashboard"
      - "reproducibility"
    peer_review:
      required_reviews: 3
      note: "A project is not complete until the learner evaluates three peers."
    optional_extra_mile:
      - "tests"
      - "make"
      - "CI/CD pipeline"

outcomes:
  - "Run local development environments with Docker, Postgres, and pgAdmin"
  - "Provision cloud infrastructure with Terraform"
  - "Build scheduled and backfilled pipelines with an orchestrator"
  - "Load data into a data lake and data warehouse"
  - "Optimize warehouse tables with partitioning and clustering"
  - "Create dbt models, tests, documentation, and analytical marts"
  - "Use a data platform to manage ingestion, transformations, quality, and deployment"
  - "Use Spark for batch processing and cloud-scale data jobs"
  - "Build a simple real-time streaming pipeline"
  - "Deliver a portfolio-ready end-to-end data engineering project"

