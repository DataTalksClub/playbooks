cohort_cadence:
  usual_start_month: "January"
  usual_duration: "9 weeks plus final project"
  frequency: "once per year"
  known_cohorts:
    - 2022
    - 2023
    - 2024
    - 2025
    - 2026
  next_live_cohort:
    year: 2027
    start: "January 2027"
    registration_status: "open"
  live_cohort_note: "Lectures are pre-recorded; live cohort means shared deadlines, scored homework, leaderboard, peer review, and certificate eligibility."

delivery:
  lectures: "pre-recorded"
  live_sessions: "kickoff, Q&A, office hours, and updates announced during the cohort"
  homework:
    live_cohort: "graded"
    self_paced: "available but not scored"
    certificate_requirement: "not required for certificate"
  submissions_platform: "courses.datatalks.club"
  certificate_available:
    live_cohort: true
    self_paced: false
  certificate_requirements:
    - "submit the final project by the live cohort deadline"
    - "complete required peer reviews"
    - "reach the course-specific minimum project score"

level:
  label: "Beginner-friendly for data engineering"
  notes: "No prior data engineering experience is required, but the course assumes basic technical literacy and is not intended as a first programming course."

prerequisites:
  required:
    - "Command line basics"
    - "Basic programming concepts: variables, functions, loops, and conditionals"
    - "Basic Python or ability to pick it up quickly"
    - "SQL fundamentals: SELECT, WHERE, JOIN, GROUP BY"
    - "Git basics"
  recommended:
    - "Docker installed or willingness to use Codespaces or a GCP VM"
    - "A text editor or IDE such as VS Code"
    - "Google Cloud account for GCS, BigQuery, and optional compute"
  not_required:
    - "Prior data engineering experience"
    - "Prior cloud experience"
    - "Advanced Python"
    - "A degree"

audience:
  primary:
    - "developers"
    - "data analysts"
    - "data scientists"
    - "people who want to learn modern data engineering"
  secondary:
    - "software engineers transitioning into data engineering"
    - "ML and MLOps practitioners who need stronger data pipeline foundations"
    - "analytics engineers who want more ingestion, orchestration, and platform experience"
    - "career switchers with programming and SQL basics"

time_commitment:
  weekly_estimate: "10-15 hours"
  typical_week:
    - "3-5 hours watching module videos"
    - "3-5 hours working through code examples"
    - "2-5 hours completing homework"
  special_notes:
    - "Module 1 usually takes two weeks because environment setup is the trickiest part."
    - "Final project usually takes 2-3 weeks of focused work."

topics:
  - "data engineering fundamentals"
  - "end-to-end data pipelines"
  - "containerization"
  - "infrastructure as code"
  - "cloud data lakes"
  - "data warehouses"
  - "workflow orchestration"
  - "ETL and ELT"
  - "data ingestion"
  - "analytics engineering"
  - "data modeling"
  - "data quality"
  - "batch processing"
  - "distributed processing"
  - "stream processing"
  - "dashboarding"
  - "project reproducibility"

