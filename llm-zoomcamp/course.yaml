modules:
  - number: 1
    title: "Agentic RAG"
    source_path: "01-agentic-rag/"
    highlights:
      - "LLM and RAG fundamentals"
      - "Fetch and explore the DataTalks.Club FAQ dataset"
      - "Build a keyword-search RAG pipeline with minsearch"
      - "Construct prompts from retrieved context"
      - "Call an LLM from Python"
      - "Create reusable RAG helper code"
      - "Persist keyword search with sqlitesearch"
      - "Use function calling to expose search as a tool"
      - "Implement an agentic loop where the model decides when and what to search"
      - "Discuss ToyAIKit and other agent frameworks"
    subfiles:
      - "01-agentic-rag/code/"
      - "01-agentic-rag/lessons/"
  - number: 2
    title: "Vector Search"
    source_path: "02-vector-search/"
    highlights:
      - "Keyword search vs semantic vector search"
      - "Generate embeddings with sentence-transformers"
      - "Create embeddings for the course FAQ dataset"
      - "Implement vector search with NumPy"
      - "Use minsearch for in-memory vector search"
      - "Replace keyword retrieval with vector retrieval in a RAG pipeline"
      - "Use sqlitesearch for persistent vector search"
      - "Use PostgreSQL with pgvector for production-style vector search"
      - "Optional ONNX Runtime embedder for lightweight deployment"
    subfiles:
      - "02-vector-search/code/"
      - "02-vector-search/embed/"
      - "02-vector-search/lessons/"
  - number: 3
    title: "AI Orchestration with Kestra"
    source_path: "03-orchestration/"
    primary_tool: "Kestra"
    instructor_note: "Created and taught by Will Russell from Kestra."
    highlights:
      - "Why context matters when using AI for workflows"
      - "Why generic AI assistants can produce unreliable orchestration code"
      - "Set up Kestra, API keys, and example flows"
      - "Use Kestra AI Copilot to generate and refine flows"
      - "Create RAG workflows with embeddings and context retrieval"
      - "Build agentic workflows with autonomous tool use"
      - "Explore multi-agent research workflows"
      - "Production best practices: cost, security, observability, and readiness"
    subfiles:
      - "03-orchestration/flows/"
      - "03-orchestration/lessons/"
      - "03-orchestration/docker-compose.yml"
  - number: 3.5
    title: "Workshop: Data Ingestion with dlt"
    source_path: "cohorts/2026/workshops/dlt.md"
    current_guidance: "The current repository file is a placeholder with details marked TBD."
    highlights:
      - "Use dlt to pull LLM traces from a monitoring service"
      - "Prepare trace data for analytics"
      - "Runs between orchestration and evaluation in the 2026 syllabus"
  - number: 4
    title: "Evaluation"
    source_path: "04-evaluation/"
    highlights:
      - "Systematic evaluation for search, RAG, and agent systems"
      - "Offline vs online evaluation"
      - "Generate ground truth data with an LLM"
      - "Batch-generate evaluation data"
      - "Evaluate retrieval quality with Hit Rate and MRR"
      - "Tune search parameters based on metrics"
      - "Generate RAG answers for evaluation"
      - "Use LLM-as-a-judge for answer quality"
      - "Capture final answers and tool-call trajectories for agent evaluation"
    subfiles:
      - "04-evaluation/code/"
      - "04-evaluation/data/"
      - "04-evaluation/lessons/"
  - number: 5
    title: "Monitoring"
    source_path: "05-monitoring/"
    highlights:
      - "Online monitoring for deployed RAG systems"
      - "Build a Streamlit chat app"
      - "Capture LLM call metrics, latency, and cost"
      - "Store conversations in PostgreSQL"
      - "Collect thumbs up/down user feedback"
      - "Use built-in LLM-as-a-judge checks"
      - "Build Streamlit dashboards"
      - "Generate synthetic data for dashboard testing"
      - "Create Grafana dashboards from SQL queries"
      - "Run app, database, and dashboards together with Docker Compose"
      - "Discuss OpenTelemetry, alerting, and next-step monitoring frameworks"
    subfiles:
      - "05-monitoring/code/"
      - "05-monitoring/lessons/"
  - number: 6
    title: "Best Practices"
    source_path: "06-best-practices/"
    optional: true
    current_guidance: "Recorded in 2024 and not updated since; techniques remain relevant, but some code uses older libraries and approaches."
    highlights:
      - "Five techniques for improving RAG pipelines"
      - "Hybrid search with Elasticsearch"
      - "Document reranking with Reciprocal Rank Fusion"
      - "Hybrid search with LangChain"
      - "Additional techniques and further reading"
  - number: 7
    title: "End-to-End Project Example"
    source_path: "07-project-example/"
    optional: true
    current_guidance: "Recorded in 2024 and optional; still useful as a model for the capstone project."
    project_example: "fitness assistant"
    highlights:
      - "Build a complete RAG project from scratch"
      - "Generate data and build an initial RAG flow"
      - "Evaluate retrieval with Hit Rate, MRR, and boosting"
      - "Evaluate RAG output with LLM-as-a-judge"
      - "Create Flask API and ingestion pipeline"
      - "Add project structure, monitoring, Docker Compose, PostgreSQL logging, and Grafana"
      - "Review cost analysis and project tips"
      - "Chunk longer sources such as articles, transcripts, and slides"

projects:
  capstone:
    source_path: "project.md"
    goal: "Build an end-to-end RAG or agent application on a knowledge base or API-backed data source of your choice."
    duration: "two weeks of focused work plus one week for peer review"
    attempts: 2
    dataset_rule: "DataTalks.Club Zoomcamp FAQ documents are used in course modules and homework and cannot be used for the project."
    required_deliverables:
      - "clear problem statement and motivation"
      - "chosen domain and knowledge base"
      - "ingestion path that makes raw data searchable"
      - "retrieval system: keyword, vector, hybrid, or equivalent"
      - "LLM-powered answering or agent layer using retrieved context and optional tools"
      - "retrieval evaluation"
      - "end-to-end RAG or agent evaluation"
      - "interface reviewers can use: script, notebook, API, or UI"
      - "README with setup, dependencies, configuration, environment variables, and examples"
    recommended_deliverables:
      - "user feedback collection"
      - "monitoring dashboard"
      - "screenshots or short app preview"
      - "containerization"
      - "separate setup or usage docs for larger projects"
    choices_allowed:
      - "RAG application, agent application, or both"
      - "any text corpus, API-backed data source, or public knowledge base not used in the course"
      - "any LLM provider, vector database, framework, or programming language"
      - "frameworks such as LangChain, LlamaIndex, Haystack, or similar tools"
      - "interfaces such as Streamlit, Dash, Flask, FastAPI, Django, notebook, or CLI"
    evaluation_criteria:
      - "problem description"
      - "retrieval flow"
      - "retrieval evaluation"
      - "LLM evaluation"
      - "interface"
      - "ingestion pipeline"
      - "monitoring"
      - "containerization"
      - "reproducibility"
      - "best practices: hybrid search, reranking, query rewriting"
      - "bonus: cloud deployment or extra high-quality additions"
    peer_review:
      required_reviews: 3
      note: "Peer review is required for certificate eligibility during a live cohort."
    project_ideas:
      - "fitness and nutrition assistant"
      - "study companion for textbooks or notes"
      - "public clinical guideline FAQ assistant"
      - "codebase Q&A bot"
      - "news summarization and retrieval tool"
      - "open-source documentation assistant"
      - "product manual support assistant"
      - "job-description skills search assistant"

outcomes:
  - "Build a RAG pipeline from scratch"
  - "Make retrieval agentic with function calling and tool use"
  - "Use embeddings and vector indexes for semantic search"
  - "Choose among keyword, vector, persistent, and pgvector-backed retrieval"
  - "Orchestrate AI workflows and agentic workflows with Kestra"
  - "Evaluate retrieval with Hit Rate and MRR"
  - "Evaluate generated answers with LLM-as-a-judge"
  - "Monitor a RAG app with metrics, feedback, PostgreSQL, Streamlit, and Grafana"
  - "Apply optional hybrid search and reranking techniques"
  - "Ship a portfolio-ready LLM application with documentation and reproducibility"

