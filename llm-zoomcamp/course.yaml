cohort_cadence:
  usual_start_month: "June"
  usual_duration: "10 weeks plus project peer review"
  frequency: "once per year"
  current_live_cohort:
    year: 2026
    start_date: "2026-06-08"
    start: "June 8, 2026, 17:00 CET"
    status: "in progress as of 2026-07-06"
    registration_status: "open in README"
  live_cohort_note: "Lectures are pre-recorded; live cohort means shared deadlines, scored homework, leaderboard, peer review, and certificate eligibility."

delivery:
  lectures: "pre-recorded"
  live_sessions: "Q&A, launch, office hours, and updates announced during the cohort"
  homework:
    live_cohort: "graded"
    self_paced: "available but not scored"
    certificate_requirement: "not required for certificate, but recommended for learning"
  submissions_platform: "courses.datatalks.club"
  certificate_available:
    live_cohort: true
    self_paced: false
  certificate_requirements:
    - "complete the final project during the live cohort"
    - "peer review three projects"
    - "meet the cohort deadlines"

level:
  label: "Intermediate for programmers"
  notes: "No ML or AI background is required, but learners should already be comfortable writing code, reading code, using Git, and running Docker."

prerequisites:
  required:
    - "Comfortable programming, preferably in Python"
    - "Command line basics"
    - "Git basics"
    - "Docker installed and runnable"
    - "An LLM provider API key or local LLM setup"
  recommended:
    - "Python 3.10+; Python 3.11 or 3.12 for a fresh setup"
    - "uv for Python dependency management"
    - "Jupyter-capable local environment or VS Code"
    - "A few dollars of hosted LLM API credit if using OpenAI"
  not_required:
    - "Prior machine-learning experience"
    - "Prior LLM engineering experience"
    - "Advanced math"
    - "GPU"
    - "Paid cloud account"
    - "A degree"

audience:
  primary:
    - "software engineers"
    - "backend engineers"
    - "data engineers"
    - "ML practitioners"
    - "AI engineering learners"
  secondary:
    - "data scientists who want stronger engineering and evaluation patterns"
    - "MLOps engineers working with LLM applications"
    - "developers adding RAG, agents, or modern search to products"
    - "career switchers who can already program"
  not_the_focus:
    - "Training LLMs from scratch"
    - "Fine-tuning and deploying open-source LLMs"
    - "Deep prompt-engineering as a standalone discipline"
    - "Image generation and multimodal systems"
    - "Guardrails as a dedicated topic"
    - "Distributed training"

time_commitment:
  weekly_estimate: "around 10 hours"
  typical_week:
    - "3-5 hours watching module videos"
    - "3-5 hours coding along and experimenting"
    - "2-5 hours completing homework"
  special_notes:
    - "Module 1 takes roughly two weeks."
    - "Vector search historically takes more time than other modules."
    - "Capstone project is planned as two weeks of focused work plus one week of peer review."

