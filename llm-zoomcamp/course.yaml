  short_name: "LLM Zoomcamp"
  status: "active"
  description: "Free hands-on course on building production-style LLM applications with RAG, agents, vector search, evaluation, and monitoring."
  primary_goal: "Help learners build, evaluate, monitor, and document end-to-end LLM-powered applications on their own knowledge bases."
  format:
    - "self-paced"
    - "live cohort"
  cost: "free"
  current_docs_status: "2026 cohort started June 8, 2026; self-paced materials are available anytime"

